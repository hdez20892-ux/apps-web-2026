<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <!-- Ícono de la pestaña (Favicon) -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Encabezado principal del sitio -->
    <header>
        <figure>
            <img src="assets/img/logo.jpeg" alt="Logotipo del Sistema">
        </figure>
        
        <h1>Sistema Web de Gestión</h1>
        
        <!-- Menú de navegación semántico -->
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Registro</a></li>
                <li><a href="#">Soporte</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido principal: Formulario de inicio de sesión -->
    <main>
        <section>
            <h2>Inicio de Sesión</h2>
            <p>Por favor, ingrese sus credenciales para acceder a la plataforma.</p>

            <!-- Formulario para cumplir el Requerimiento Funcional RF02 -->
            <form action="#" method="POST">

                <div>
                    <label for="email">Correo electrónico:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ejemplo@correo.com" 
                        required>
                </div>

                <div>
                    <label for="password">Contraseña:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required>
                </div>

                <div>
                    <button type="submit">Iniciar Sesión</button>
                </div>

            </form>

            <div>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
        </section>
    </main>

    <!-- Pie de página con derechos reservados -->
    <footer>
        <p>&copy; 2026 Sistema Web. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
